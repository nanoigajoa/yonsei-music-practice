services:
  api:
    build: ../api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
